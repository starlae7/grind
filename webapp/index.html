<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planner (Tate Style)</title>
    <!-- Подключение библиотеки Telegram Web App -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: var(--tg-theme-bg-color, #121212);
            color: var(--tg-theme-text-color, #ffffff);
            margin: 0;
            padding: 20px;
        }
        h1 {
            text-align: center;
            color: #ff3b30;
        }
        .task-list {
            margin-top: 20px;
        }
        .task-item {
            background-color: var(--tg-theme-secondary-bg-color, #1c1c1e);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .task-text {
            font-size: 16px;
        }
        .btn-add {
            display: block;
            width: 100%;
            padding: 15px;
            background-color: var(--tg-theme-button-color, #ff3b30);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            margin-top: 20px;
            cursor: pointer;
        }
        input[type="text"] {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            background-color: var(--tg-theme-secondary-bg-color, #1c1c1e);
            border: 1px solid #333;
            color: var(--tg-theme-text-color, #fff);
            border-radius: 5px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <h1>Твои Задачи</h1>
    <p style="text-align:center;">Хватит отдыхать. Выполни это.</p>

    <div id="addTaskForm" style="display: none;">
        <input type="text" id="taskTitle" placeholder="Введи задачу...">
        <button class="btn-add" id="saveBtn">Сохранить</button>
    </div>

    <div class="task-list" id="taskList">
        <!-- Задачи будут добавляться сюда JS кодом -->
    </div>

    <button class="btn-add" id="showFormBtn">+ Новая Задача</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand(); // Открываем на весь экран

        const showFormBtn = document.getElementById('showFormBtn');
        const addTaskForm = document.getElementById('addTaskForm');
        const saveBtn = document.getElementById('saveBtn');
        const taskTitle = document.getElementById('taskTitle');
        const taskList = document.getElementById('taskList');

        showFormBtn.addEventListener('click', () => {
            addTaskForm.style.display = 'block';
            showFormBtn.style.display = 'none';
        });

        saveBtn.addEventListener('click', () => {
            const title = taskTitle.value.trim();
            if (title) {
                // Отправляем данные обратно в бота
                tg.sendData(JSON.stringify({action: 'add_task', title: title}));
                tg.close();
            } else {
                tg.showAlert("Напиши текст задачи!");
            }
        });
    </script>
</body>
</html>
